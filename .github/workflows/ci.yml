name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Go ${{ matrix.go }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.21.x', stable]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - run: go test -count=1 ./...
      - run: go vet ./...

  race:
    name: Race
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: stable
          cache: false
      - run: go test -race -count=1 ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: stable
          cache: false
      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.13.1

  cross-build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: windows
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: stable
          cache: false
      - run: go build ./...
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}

  integration:
    name: MiniZinc ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: 2.6.4
            sha256: 2e3c2ad1f40c4d45e3af7b24f5445c520c895cdb1d6f390e1b3d679968933414
          - version: 2.10.0
            sha256: 1781daef871a52bebc992b21049ed514cfcdf7cc652ce26df8c9fa82aca1a852
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: stable
          cache: false
      - name: Install MiniZinc
        env:
          MINIZINC_VERSION: ${{ matrix.version }}
          MINIZINC_SHA256: ${{ matrix.sha256 }}
        run: |
          archive="MiniZincIDE-${MINIZINC_VERSION}-bundle-linux-x86_64.tgz"
          curl -fsSLO "https://github.com/MiniZinc/MiniZincIDE/releases/download/${MINIZINC_VERSION}/${archive}"
          echo "${MINIZINC_SHA256}  ${archive}" | sha256sum -c -
          mkdir "$RUNNER_TEMP/minizinc"
          tar -xzf "$archive" --strip-components=1 -C "$RUNNER_TEMP/minizinc"
          echo "$RUNNER_TEMP/minizinc/bin" >> "$GITHUB_PATH"
      - name: Verify solvers
        run: |
          minizinc --version
          minizinc --solvers | grep -i gecode
          minizinc --solvers | grep -i coin-bc
      - name: Run required integrations
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/integration.log"
          go test -count=1 -v -run '^(TestDriver|TestFindSolver|TestListSolvers|TestSimpleSolve|TestSolveWithParams|TestSolveScopedParams|TestMiniZincValues|TestSolveAll|TestSolveStream|TestGecodeSolverOptions|TestCoinBCSolverOptions)$' . | tee "$log"
          if grep -q -- '--- SKIP' "$log"; then
            exit 1
          fi
      - run: go test -count=1 ./...
